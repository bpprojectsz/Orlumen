name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
      WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret for $name (ANDROID_$name)"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/orlumen-release.jks"
          {
            echo "storeFile=orlumen-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      - name: Unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew test 2>&1 | tee gradle.log

      - name: Build release APK and AAB
        run: |
          set -o pipefail
          ./gradlew bundleRelease assembleRelease 2>&1 | tee -a gradle.log

      - name: Relay failure output to annotations
        if: failure()
        run: |
          python3 - <<'PY'
          text = open("gradle.log").read()
          start = text.find("FAILURE:")
          text = text[start:start + 5500] if start >= 0 else text[-5500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle output::" + text)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orlumen-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: orlumen-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: orlumen-r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
