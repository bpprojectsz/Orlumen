name: Light check

on:
  push:
    branches: [main]

concurrency:
  group: light-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint, detekt, compile and unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew ktlintCheck detekt compileDebugKotlin testDebugUnitTest 2>&1 | tee gradle.log

      - name: Relay failure output to annotations
        if: failure()
        run: |
          python3 - <<'PY'
          text = open("gradle.log").read()
          import glob, re
          errors = [line for line in text.splitlines() if line.startswith("e: ") or " error: " in line]
          errors += [line for line in text.splitlines() if re.search(r"\.kt:\d+", line) and line not in errors]
          for report in glob.glob("app/build/reports/detekt/*.xml") + glob.glob("app/build/reports/ktlint/**/*.txt", recursive=True):
              for line in open(report).read().splitlines():
                  if "<file " in line or "<error " in line or ".kt:" in line:
                      errors.append(re.sub(r"\s+", " ", line.strip())[:300])
          start = text.find("FAILURE:")
          tail = text[start:start + 1500] if start >= 0 else text[-1500:]
          text = "\n".join(errors)[:4000] + "\n---\n" + tail
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle output::" + text)
          PY
